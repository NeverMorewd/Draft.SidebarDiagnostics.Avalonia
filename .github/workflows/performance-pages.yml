name: Performance - Refresh report history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: performance-pages-refresh
  cancel-in-progress: false

jobs:
  pages:
    name: Deploy performance history
    if: ${{ vars.PERFORMANCE_PAGES_ENABLED == 'true' }}
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/deploy-pages.yml@67cd09c8b926973abd0fa87b0cab9b206da2f675
    with:
      history-days: 14
      maximum-runs: 50
      toolkit-ref: 67cd09c8b926973abd0fa87b0cab9b206da2f675
