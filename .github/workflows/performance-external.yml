name: Performance - External executable

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Operating system of the dedicated metric runner
        required: true
        type: choice
        options:
          - Windows
          - Linux
          - macOS
      executable-path:
        description: Absolute path to the executable on the runner
        required: true
        type: string
      allowed-root:
        description: Absolute directory that contains the executable
        required: true
        type: string
      working-directory:
        description: Optional absolute working directory inside the allowed root
        required: false
        default: ''
        type: string
      arguments-json:
        description: Command arguments encoded as a JSON array
        required: true
        default: '[]'
        type: string
      report-label:
        description: Application name shown in the report
        required: true
        default: External .NET application
        type: string
      warmup-seconds:
        description: Warm-up time before each baseline measurement
        required: true
        default: 60
        type: number
      measurement-seconds:
        description: Baseline measurement time per iteration
        required: true
        default: 300
        type: number
      iterations:
        description: Number of independent baseline iterations
        required: true
        default: 3
        type: number
      collect-counters:
        description: Collect a separate managed runtime counter pass
        required: true
        default: true
        type: boolean
      collect-trace:
        description: Collect a separate 30-second EventPipe trace
        required: true
        default: false
        type: boolean

concurrency:
  group: performance-external-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profile:
    name: Test cross-repository workflow access
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/cross-repository-probe.yml@fix/cross-repository-calls
    with:
      platform: ${{ inputs.platform }}
