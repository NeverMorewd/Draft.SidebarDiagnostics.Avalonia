name: Self-hosted runner check

on:
  workflow_dispatch:
  push:
    branches:
      - ci/self-hosted-runner-check
    paths:
      - .github/workflows/self-hosted-runner-check.yml

concurrency:
  group: self-hosted-runner-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows metric runner
    runs-on: [self-hosted, Windows, X64, metric-test]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify runner environment
        shell: pwsh
        run: |
          $process = Get-Process -Id $PID
          $sessionId = $process.SessionId

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Session: $sessionId"

          if ($sessionId -eq 0) {
            throw "The runner is executing in non-interactive Session 0. Start run.cmd from a signed-in desktop session."
          }

          dotnet --info

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore SidebarDiagnostics.slnx --locked-mode

      - name: Build Release
        shell: pwsh
        run: dotnet build SidebarDiagnostics.slnx --configuration Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test SidebarDiagnostics.slnx --configuration Release --no-build
