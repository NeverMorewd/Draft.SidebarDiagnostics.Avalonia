name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore SidebarDiagnostics.slnx --locked-mode
      - run: dotnet build SidebarDiagnostics.slnx --configuration Release --no-restore
      - run: dotnet test SidebarDiagnostics.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage" --results-directory artifacts/test-results
      - name: Publish Windows security-audit artifact
        if: runner.os == 'Windows'
        run: dotnet publish src/SidebarDiagnostics.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/security/win-x64
      - name: Audit Windows artifact for legacy drivers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-ReleaseSecurity.ps1 -PublishDirectory artifacts/security/win-x64
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
