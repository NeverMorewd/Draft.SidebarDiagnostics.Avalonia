name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore SidebarDiagnostics.slnx --locked-mode
      - run: dotnet build SidebarDiagnostics.slnx --configuration Release --no-restore
      - run: dotnet test SidebarDiagnostics.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage" --results-directory artifacts/test-results
      - name: Validate package metadata generation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/metadata-input | Out-Null
          'windows' | Set-Content artifacts/metadata-input/SidebarDiagnostics-win-x64.zip
          'macos-intel' | Set-Content artifacts/metadata-input/SidebarDiagnostics-osx-x64.zip
          'macos-arm' | Set-Content artifacts/metadata-input/SidebarDiagnostics-osx-arm64.zip
          'linux-x64' | Set-Content artifacts/metadata-input/SidebarDiagnostics-linux-x64.deb
          'linux-arm64' | Set-Content artifacts/metadata-input/SidebarDiagnostics-linux-arm64.deb
          ./scripts/Generate-PackageMetadata.ps1 -Version 0.0.0-ci -ArtifactDirectory artifacts/metadata-input -OutputDirectory artifacts/metadata-output
      - name: Validate Homebrew Cask syntax
        if: runner.os == 'macOS'
        run: ruby -c artifacts/metadata-output/homebrew/Casks/sidebar-diagnostics-avalonia.rb
      - name: Publish Windows security-audit artifact
        if: runner.os == 'Windows'
        run: dotnet publish src/SidebarDiagnostics.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/security/win-x64
      - name: Audit Windows artifact for legacy drivers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-ReleaseSecurity.ps1 -PublishDirectory artifacts/security/win-x64
      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish src/SidebarDiagnostics.App.csproj --configuration Release --runtime linux-x64 --self-contained true --no-restore --output artifacts/package-test/publish
          ./scripts/Build-DebPackage.sh artifacts/package-test/publish artifacts/package-test 0.0.0-ci linux-x64
      - name: Verify Debian install, upgrade, and uninstall
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y ./artifacts/package-test/SidebarDiagnostics-linux-x64.deb
          test "$(dpkg-query -W -f='${Version}' sidebar-diagnostics)" = "0.0.0-ci"
          test -x /usr/bin/sidebar-diagnostics
          ./scripts/Build-DebPackage.sh artifacts/package-test/publish artifacts/package-test 0.0.1-ci linux-x64
          sudo apt-get install -y ./artifacts/package-test/SidebarDiagnostics-linux-x64.deb
          test "$(dpkg-query -W -f='${Version}' sidebar-diagnostics)" = "0.0.1-ci"
          sudo apt-get remove -y sidebar-diagnostics
          ! dpkg-query -W sidebar-diagnostics
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error
