name: Performance - Repository application

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Operating system of the dedicated metric runner
        required: true
        type: choice
        options:
          - Windows
          - Linux
          - macOS
      warmup-seconds:
        description: Warm-up time before each baseline measurement
        required: true
        default: 60
        type: number
      measurement-seconds:
        description: Baseline measurement time per iteration
        required: true
        default: 300
        type: number
      iterations:
        description: Number of independent baseline iterations
        required: true
        default: 3
        type: number
      collect-trace:
        description: Collect a separate 30-second EventPipe trace
        required: true
        default: false
        type: boolean

concurrency:
  group: performance-repository-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profile:
    name: Profile Native AOT application on ${{ inputs.platform }}
    uses: NeverMorewd/DotNetPerformanceLab/.github/workflows/profile-repository.yml@fix/diagnostic-tool-timeout
    with:
      platform: ${{ inputs.platform }}
      project-path: src/SidebarDiagnostics.App.csproj
      runtime-identifier: ${{ inputs.platform == 'Windows' && 'win-x64' || inputs.platform == 'Linux' && 'linux-x64' || 'osx-x64' }}
      executable-path: ${{ inputs.platform == 'Windows' && 'SidebarDiagnostics.App.exe' || 'SidebarDiagnostics.App' }}
      report-label: Sidebar Diagnostics Native AOT
      self-contained: true
      publish-aot: true
      publish-trimmed: true
      locked-restore: true
      warmup-seconds: ${{ fromJSON(github.event.inputs['warmup-seconds']) }}
      measurement-seconds: ${{ fromJSON(github.event.inputs['measurement-seconds']) }}
      sample-interval-ms: 1000
      cooldown-seconds: 10
      iterations: ${{ fromJSON(github.event.inputs.iterations) }}
      collect-counters: true
      counter-duration-seconds: 30
      collect-trace: ${{ fromJSON(github.event.inputs['collect-trace']) }}
      trace-duration-seconds: 30
      artifact-retention-days: 14
